services:
  motor-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luz_backend_python
    expose:
      - "8000"
    volumes:
      - ./datos:/app/datos   # la base de datos queda en el disco del servidor, no dentro del contenedor
    environment:
      - TZ=America/Caracas
    restart: always

  orquestador-node:
    build:
      context: ./GatewayNode
      dockerfile: Dockerfile
    container_name: luz_gateway_node
    ports:
      - "127.0.0.1:5050:5000"
    environment:
      - PORT=5000
      - VL_WHATSAPP=${VL_WHATSAPP:-}   # numero del bot para el boton del mapa (en .env); vacio = boton oculto
    restart: always
    depends_on:
      - motor-python

  automatizacion-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: luz_plataforma_n8n
    ports:
      - "127.0.0.1:5678:5678"
    environment:
      - N8N_HOST=n8n.brecha-cero.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n.brecha-cero.com/
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data_storage:/home/node/.n8n
    restart: always

# DEFINICIÓN EXPLICITA DEL VOLUMEN (Soldadura de Red
volumes:
  n8n_data_storage:
    name: luz_n8n_data_volume

