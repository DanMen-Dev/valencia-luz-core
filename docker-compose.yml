services:
  motor-python:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: luz_backend_python
    expose:
      - "8000"
    restart: always

  orquestador-node:
    build:
      context: ./GatewayNode
      dockerfile: Dockerfile
    container_name: luz_gateway_node
    ports:
      - "5050:5000"
    environment:
      - PORT=5000
    restart: always
    depends_on:
      - motor-python

  automatizacion-n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    container_name: luz_plataforma_n8n
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=n8n.brecha-cero.com
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - NODE_ENV=production
      - WEBHOOK_URL=http://n8n.brecha-cero.com/
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data_storage:/home/node/.n8n
    restart: always

  puente-whatsapp-waha:
    image: devlikeapro/waha:latest
    container_name: luz_puente_whatsapp_waha
    restart: always
    ports:
      - "3000:3000"
    env_file:
      - .env
    volumes:
      - waha_sessions:/app/.sessions

# DEFINICIÓN EXPLICITA DEL VOLUMEN (Soldadura de Red)
volumes:
  n8n_data_storage:
    name: luz_n8n_data_volume
  whatsapp_instances:
    name: luz_whatsapp_instances_volume