<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Valencia Luz · Mapa de cortes</title>
  <meta name="description" content="Mapa comunitario de cortes de luz en Valencia y Carabobo, con reportes de los vecinos.">
  <link rel="stylesheet" href="/leaflet/leaflet.css">
  <link rel="stylesheet" href="/recursos/mapa.css">
  <script src="/leaflet/leaflet.js" defer></script>
  <script src="/recursos/mapa.js" defer></script>
</head>
<body>
  <div id="app">
    <aside id="panel">
      <header>
        <h1>Valencia Luz <span aria-hidden="true">⚡</span></h1>
        <p class="sub">Cortes de luz reportados por los vecinos de Carabobo. No es información oficial de Corpoelec.</p>
      </header>

      <section class="acciones" aria-label="Reportar">
        <button type="button" class="btn btn-corte" data-luz="0">📍 No hay luz donde estoy</button>
        <button type="button" class="btn btn-volvio" data-luz="1">💡 Ya volvió la luz donde estoy</button>
        <a id="btn-wa" class="btn btn-wa" hidden target="_blank" rel="noopener">💬 Reportar por WhatsApp</a>
        <p id="aviso" class="aviso" role="status" aria-live="polite"></p>
      </section>

      <section class="leyenda" aria-label="Leyenda">
        <div class="item"><span class="punto gris"></span> Sin luz (reporte de un vecino)</div>
        <div class="item"><span class="punto amarillo"></span> Volvió la luz</div>
        <p id="estado" class="estado">Cargando reportes…</p>
      </section>
    </aside>
    <main id="mapa" aria-label="Mapa de reportes"></main>
  </div>
</body>
</html>
